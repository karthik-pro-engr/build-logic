name: Publish Convention Snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - 'release/*'
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:   # reinforce per-job permissions
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Determine run mode (validate vs publish)
        id: set_mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=validate" >> $GITHUB_OUTPUT
          else
            echo "mode=publish" >> $GITHUB_OUTPUT
          fi

      - name: Publish validation (PRs) — publishToMavenLocal
        if: steps.set_mode.outputs.mode == 'validate'
        run: |
          echo "PR validation mode — running publishToMavenLocal (no secrets required)"
          chmod +x ./gradlew
          ./gradlew :convention:publishToMavenLocal --no-daemon

      - name: Real publish (push to main)
        if: steps.set_mode.outputs.mode == 'publish'
        env:
          GPR_USER: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GPR_TOKEN" ]; then
            echo "ERROR: GPR_TOKEN is empty"; exit 1
          fi
          echo "Push to main — performing real publish"
          chmod +x ./gradlew
          ./gradlew :convention:publish -Pgpr.user=$GPR_USER -Pgpr.key=$GPR_TOKEN --no-daemon
